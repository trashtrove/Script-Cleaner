<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanlation Script Cleaner</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f5;
            color: #18181b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header { margin-bottom: 15px; }
        h2 { margin-top: 0; margin-bottom: 8px; }
        .description-box {
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid #4f46e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scroll-sync-toggle {
            background: white; border: 1px solid #c7d2fe; color: #3730a3;
            padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold;
            cursor: pointer; transition: 0.15s; white-space: nowrap;
        }
        .scroll-sync-toggle.active {
            background: #4f46e5; color: white; border-color: #4f46e5;
        }
        .container {
            display: flex; gap: 20px; flex: 1; min-height: 0; margin-top: 10px;
        }
        .panel { flex: 1; display: flex; flex-direction: column; position: relative; }
        .editable-area {
            flex: 1; padding: 15px; border: 1px solid #d4d4d8; border-radius: 8px;
            font-family: monospace; font-size: 14px; line-height: 1.5;
            background-color: white; overflow-y: auto; white-space: pre-wrap;
        }
        .editable-area:empty:before {
            content: attr(data-placeholder); color: #a1a1aa; pointer-events: none;
        }
        textarea {
            flex: 1; resize: none; padding: 15px; border: 1px solid #d4d4d8;
            border-radius: 8px; font-family: monospace; font-size: 14px; line-height: 1.5;
            background-color: #f8fafc;
        }
        .controls { display: flex; justify-content: center; gap: 10px; padding: 15px 0 5px 0; }
        button {
            background-color: #2563eb; color: white; border: none; padding: 12px 24px;
            border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #10b981; }
        .btn-secondary:hover { background-color: #059669; }
        
        /* Smart Review UI */
        .resolver-container {
            display: none;
            background: white;
            border: 2px solid #fbbf24;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            max-height: 220px;
            overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .resolver-title {
            font-weight: bold; color: #b45309; margin-bottom: 10px; font-size: 14px;
        }
        .conflict-group {
            margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0;
        }
        .conflict-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .conflict-label {
            font-size: 12px; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 6px;
        }
        .toggle-btn {
            padding: 8px 12px; margin: 4px 0; border-radius: 6px; border: 2px solid #cbd5e1;
            cursor: pointer; background: #f8fafc; color: #64748b; font-family: monospace; font-size: 13px;
            transition: all 0.15s ease; position: relative; padding-left: 32px; text-align: left; width: 100%; box-sizing: border-box;
        }
        .toggle-btn::before {
            content: '❌'; position: absolute; left: 10px; font-size: 11px; top: 50%; transform: translateY(-50%);
        }
        .toggle-btn.active {
            background: #ecfdf5; border-color: #10b981; color: #065f46; font-weight: bold;
        }
        .toggle-btn.active::before { content: '✅'; }

        /* Highlight flash effect using a temporary class */
        @keyframes flashHighlight {
            0% { background-color: #fef08a; }
            100% { background-color: inherit; }
        }
        .flash-highlight {
            animation: flashHighlight 1.5s ease-out;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Nocti's Script Cleaner</h2>
        <div class="description-box">
            <span><strong>Workflow Tip:</strong> Enable Linked Scroll below to lock panels together. Clicking review options will highlight the line on <strong>both</strong> the input and output panels.</span>
            <button id="syncBtn" class="scroll-sync-toggle" onclick="toggleScrollSync()">🔗 Linked Scroll: OFF</button>
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <label style="margin-bottom: 8px; font-weight: bold;">Paste Original Script here:</label>
            <div id="input" class="editable-area" contenteditable="true" data-placeholder="Paste from Google Docs with colors intact..."></div>
        </div>
        
        <div class="panel">
            <label for="output" style="margin-bottom: 8px; font-weight: bold;">Cleaned Output (Ready for Typesetting):</label>
            <div id="resolver" class="resolver-container"></div>
            <textarea id="output" readonly placeholder="Cleaned plain text will appear here..."></textarea>
        </div>
    </div>

    <div class="controls">
        <button onclick="processScript()">✨ Clean & Analyze Script</button>
        <button class="btn-secondary" onclick="copyOutput()">📋 Copy Output</button>
    </div>

    <script>
        const REMOVE_PREFIXES = [
            "TL/N FOR PR", "TL/N TO PR", "TL TO PR", "PR/N TO TL", "PR/N FOR TL"
        ];

        let globalItems = [];
        let isSyncActive = false;

        const inputDiv = document.getElementById('input');
        const outputArea = document.getElementById('output');

        inputDiv.addEventListener('paste', (e) => {
            inputDiv.dataset.rawText = e.clipboardData.getData('text/plain');
        });
        inputDiv.addEventListener('input', () => {
            inputDiv.dataset.rawText = inputDiv.innerText;
        });

        // --- Scroll Syncing Logic ---
        function toggleScrollSync() {
            isSyncActive = !isSyncActive;
            let btn = document.getElementById('syncBtn');
            btn.classList.toggle('active', isSyncActive);
            btn.innerText = isSyncActive ? "🔗 Linked Scroll: ON" : "🔗 Linked Scroll: OFF";
        }

        let isScrolling = false;
        inputDiv.addEventListener('scroll', () => {
            if (!isSyncActive || isScrolling) return;
            isScrolling = true;
            let percentage = inputDiv.scrollTop / (inputDiv.scrollHeight - inputDiv.clientHeight || 1);
            outputArea.scrollTop = percentage * (outputArea.scrollHeight - outputArea.clientHeight);
            setTimeout(() => isScrolling = false, 50);
        });

        outputArea.addEventListener('scroll', () => {
            if (!isSyncActive || isScrolling) return;
            isScrolling = true;
            let percentage = outputArea.scrollTop / (outputArea.scrollHeight - outputArea.clientHeight || 1);
            inputDiv.scrollTop = percentage * (inputDiv.scrollHeight - inputDiv.clientHeight);
            setTimeout(() => isScrolling = false, 50);
        });

        // --- Core Script Logic ---
        function isCJK(text) { return /[\uac00-\ud7a3\u3040-\u30ff\u4e00-\u9fff]/.test(text); }
        function detectLang(text) {
            if (/[\uac00-\ud7a3]/.test(text)) return "ksfx";
            if (/[\u3040-\u30ff]/.test(text)) return "jsfx"; 
            if (/[\u4e00-\u9fff]/.test(text)) return "csfx";
            return "osfx";
        }

        function getBasePrefix(line) {
            let upper = line.toUpperCase();
            if (upper.startsWith("SFX")) return "SFX";
            if (upper.startsWith("ST")) return "ST";
            if (upper.startsWith("NA")) return "NA";
            let m = line.match(/^([“”"'\[\]{}()<>*/#]+)/);
            if (m) return m[1];
            return null;
        }

        function isNote(line) {
            let n = line.toUpperCase();
            return REMOVE_PREFIXES.some(p => n.startsWith(p));
        }

        function isPage(line) {
            let l = line.toLowerCase();
            return l.includes("page") || l.includes(".png");
        }

        function getSimilarity(str1, str2) {
            let words1 = str1.toLowerCase().match(/\b[a-z0-9]+\b/g) || [];
            let words2 = str2.toLowerCase().match(/\b[a-z0-9]+\b/g) || [];
            if (words1.length === 0 || words2.length === 0) return 0;
            
            let matchCount = 0;
            let temp2 = [...words2];
            for (let w of words1) {
                let idx = temp2.indexOf(w);
                if (idx !== -1) {
                    matchCount++;
                    temp2.splice(idx, 1);
                }
            }
            return matchCount / Math.max(words1.length, words2.length);
        }

        function convertSfx(line) {
            if (!line.toLowerCase().startsWith("sfx")) return null;

            let mA = line.match(/^sfx\s+([^:]+?)\s*:\s*(.*)/i);
            if (mA && isCJK(mA[1])) {
                let original = mA[1].trim();
                return [`${detectLang(original)}: ${original}`, `sfx:  ${mA[2].trim()}`];
            }

            let mB = line.match(/^sfx\s*:\s*(.*)/i);
            if (mB) {
                let parts = mB[1].split(' ');
                let origParts = [], transParts = [], inOrig = true;

                for (let p of parts) {
                    if (!p) continue;
                    if (inOrig && /[a-zA-Z]/.test(p) && !/^\d*x$/i.test(p)) inOrig = false;
                    
                    if (inOrig) origParts.push(p);
                    else transParts.push(p);
                }

                if (origParts.length > 0 && transParts.length > 0) {
                    let original = origParts.join(' ');
                    if (isCJK(original)) {
                        return [`${detectLang(original)}: ${original}`, `sfx:  ${transParts.join(' ')}`];
                    }
                }
            }
            return null; 
        }

        function processScript() {
            const rawText = inputDiv.dataset.rawText || inputDiv.innerText;
            const lines = rawText.split(/\r?\n/).map(l => l.replace(/[\u00A0\u200B]/g, ' ').trim());
            
            globalItems = [];
            let currentGroup = null;

            for (let i = 0; i < lines.length; i++) {
                let stripped = lines[i];
                if (!stripped) continue;

                if (isPage(stripped)) {
                    globalItems.push({ type: 'page', text: stripped });
                    currentGroup = null;
                    continue;
                }

                if (isNote(stripped)) continue;

                let prefix = getBasePrefix(stripped);

                if (currentGroup && prefix && currentGroup.prefix === prefix) {
                    currentGroup.lines.push({ text: stripped, selected: true });
                } else {
                    currentGroup = { type: 'group', prefix: prefix || 'TEXT', lines: [{ text: stripped, selected: true }] };
                    globalItems.push(currentGroup);
                }
            }

            for (let item of globalItems) {
                if (item.type === 'group' && item.lines.length > 1) {
                    for (let i = 0; i < item.lines.length - 1; i++) {
                        if (getSimilarity(item.lines[i].text, item.lines[i+1].text) > 0.25) {
                            item.lines[i].selected = false;
                        }
                    }
                }
            }

            renderResolver();
            renderOutput();
        }

        function renderResolver() {
            let container = document.getElementById('resolver');
            container.innerHTML = '<div class="resolver-title">🔍 Smart Review: Click to toggle lines (highlights position on both sides)</div>';
            let hasConflicts = false;

            for (let item of globalItems) {
                if (item.type === 'group' && item.lines.length > 1) {
                    hasConflicts = true;
                    let groupDiv = document.createElement('div');
                    groupDiv.className = 'conflict-group';
                    
                    let label = document.createElement('div');
                    label.className = 'conflict-label';
                    label.innerText = `Tag Group: ${item.prefix}`;
                    groupDiv.appendChild(label);

                    for (let lineObj of item.lines) {
                        let btn = document.createElement('div');
                        btn.className = `toggle-btn ${lineObj.selected ? 'active' : ''}`;
                        btn.innerText = lineObj.text;
                        btn.onclick = () => {
                            lineObj.selected = !lineObj.selected; 
                            renderResolver(); 
                            renderOutput();   
                            highlightInBothPanels(lineObj.text);
                        };
                        groupDiv.appendChild(btn);
                    }
                    container.appendChild(groupDiv);
                }
            }

            container.style.display = hasConflicts ? 'block' : 'none';
        }

        function renderOutput() {
            let out = [];

            for (let item of globalItems) {
                if (item.type === 'page') {
                    if (out.length > 0) out.push(""); 
                    out.push(item.text);
                } else if (item.type === 'group') {
                    for (let lineObj of item.lines) {
                        if (lineObj.selected) {
                            let sfxLines = convertSfx(lineObj.text);
                            if (sfxLines) {
                                out.push(...sfxLines);
                            } else {
                                out.push(lineObj.text);
                            }
                        }
                    }
                }
            }

            outputArea.value = out.join('\n');
        }

        // --- Dual Panel Highlighting Feature ---
        function highlightInBothPanels(targetText) {
            // 1. Highlight in Input Panel (contenteditable div)
            let inputContent = inputDiv.innerText;
            let inputIdx = inputContent.indexOf(targetText);
            if (inputIdx !== -1) {
                let linesBeforeInput = inputContent.substring(0, inputIdx).split('\n').length;
                inputDiv.scrollTop = Math.max(0, (linesBeforeInput - 4) * 21);
                
                // Add temporary flash class wrapper effect or background flash on input div wrapper
                inputDiv.classList.add('flash-highlight');
                setTimeout(() => inputDiv.classList.remove('flash-highlight'), 1500);
            }

            // 2. Highlight in Output Panel (textarea)
            let outputText = outputArea.value;
            let convertedSfx = convertSfx(targetText);
            let searchTarget = convertedSfx ? convertedSfx[1] : targetText; 

            let outputIdx = outputText.indexOf(searchTarget);
            if (outputIdx !== -1) {
                outputArea.focus();
                outputArea.setSelectionRange(outputIdx, outputIdx + searchTarget.length);
                
                let linesBeforeOutput = outputText.substring(0, outputIdx).split('\n').length;
                outputArea.scrollTop = Math.max(0, (linesBeforeOutput - 4) * 21);

                outputArea.classList.add('flash-highlight');
                setTimeout(() => outputArea.classList.remove('flash-highlight'), 1500);
            }
        }

        function copyOutput() {
            outputArea.select();
            document.execCommand('copy');
            const btn = document.querySelector('.btn-secondary');
            btn.innerText = "✓ Copied!";
            setTimeout(() => btn.innerText = "📋 Copy Output", 2000);
        }
    </script>
</body>
</html>
